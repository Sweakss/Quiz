<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Quiz Application</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app-wrapper">
    <header class="app-header">
      <h1>Study Quiz App</h1>
      <p class="subtitle">Custom Science & General Flashcards</p>
      
      <!-- Primary Tab Controls -->
      <nav class="tab-nav">
        <button type="button" class="tab-btn active" data-tab="practiceTab">Practice Mode</button>
        <button type="button" class="tab-btn" data-tab="createTab">Create Card</button>
        <button type="button" class="tab-btn" data-tab="manageTab">Manage Groups & Cards</button>
      </nav>
    </header>

    <main class="app-container">
      
      <!-- Active Group Quick Banner -->
      <div class="group-banner">
        <span>Active Group: <strong id="activeGroupTitle">Default Group</strong></span>
        <span>Remaining Cards: <strong id="statRemaining">0</strong> / <strong id="statTotal">0</strong></span>
      </div>

      <!-- TAB 1: PRACTICE MODE -->
      <section id="practiceTab" class="tab-content active">
        <div class="card practice-card">
          <h2>Practice</h2>
          
          <div id="quizDisplay" class="quiz-display">
            <p class="empty-msg">No cards available in this group. Add some cards to start!</p>
          </div>

          <div class="input-group">
            <input type="text" id="userInput" placeholder="Type your answer here..." autocomplete="off">
          </div>

          <!-- Symbol Bar -->
          <div class="symbol-bar">
            <button type="button" class="sym-btn" onclick="addSymbol('→')">→</button>
            <button type="button" class="sym-btn" onclick="addSymbol('°')">°</button>
            <button type="button" class="sym-btn" onclick="addSymbol('²')">²</button>
            <button type="button" class="sym-btn" onclick="addSymbol('³')">³</button>
            <button type="button" class="sym-btn" onclick="addSymbol('Δ')">Δ</button>
            <button type="button" class="sym-btn" onclick="addSymbol('±')">±</button>
          </div>

          <div class="button-group">
            <button type="button" class="btn btn-submit" onclick="checkAnswer()">Check Answer</button>
            <button type="button" class="btn btn-skip" onclick="skipCard()">Skip / Next</button>
            <button type="button" class="btn btn-hint" onclick="showHint()">Hint</button>
          </div>

          <div id="feedback" class="feedback-msg"></div>
        </div>
      </section>

      <!-- TAB 2: CREATE CARD -->
      <section id="createTab" class="tab-content">
        <div class="card creation-card">
          <h2>Create New Card</h2>
          <form id="createForm" onsubmit="handleCardSubmit(event)">
            
            <div class="form-group">
              <label for="targetDeckSelect">Target Group / Deck:</label>
              <select id="targetDeckSelect"></select>
            </div>

            <div class="form-group">
              <label for="promptText">Question / Prompt (Optional if image supplied)</label>
              <input type="text" id="promptText" placeholder="e.g., What organelle is shown? or Balance: H2 + O2 -> ?">
            </div>

            <div class="form-group">
              <label>Image Source (Optional)</label>
              <div class="image-input-toggle">
                <input type="text" id="imageUrl" placeholder="Paste Image URL (e.g., https://...)">
                <span class="divider">OR</span>
                <input type="file" id="imageFile" accept="image/*" onchange="handleFileUpload(event)">
              </div>
              <div id="imagePreviewContainer" class="image-preview-box" style="display: none;">
                <img id="imagePreview" src="" alt="Preview">
                <button type="button" class="btn-remove-img" onclick="removeSelectedImage()">Remove Image</button>
              </div>
            </div>

            <div class="form-group">
              <label for="correctAnswer">Correct Answer(s) <span class="required">*</span></label>
              <input type="text" id="correctAnswer" placeholder="e.g., Mitochondria (separate multiple answers with commas)" required>
            </div>

            <div class="form-group">
              <label for="hintText">Custom Hint (Optional)</label>
              <input type="text" id="hintText" placeholder="e.g., Powerhouse of the cell">
            </div>

            <button type="submit" class="btn btn-submit full-width">Add Card</button>
          </form>
        </div>
      </section>

      <!-- TAB 3: MANAGE GROUPS & CARDS -->
      <section id="manageTab" class="tab-content">
        
        <!-- Group Manager Panel -->
        <div class="card group-manager-card">
          <h2>Group / Deck Manager</h2>
          
          <div class="form-group">
            <label for="deckSelect">Select Active Group:</label>
            <div class="select-row">
              <select id="deckSelect" onchange="handleDeckChange()"></select>
              <button type="button" class="btn btn-danger-outline" onclick="deleteActiveGroup()">Delete Group</button>
            </div>
          </div>

          <hr class="card-divider">

          <form onsubmit="handleDeckSubmit(event)" class="inline-form">
            <input type="text" id="newDeckName" placeholder="New Group Name (e.g., Biology Ch 2)" required>
            <button type="submit" class="btn btn-submit">Create Group</button>
          </form>
        </div>

        <!-- Card List Panel -->
        <div class="card manager-card">
          <div class="manager-header">
            <h2>Cards in Selected Group</h2>
          </div>
          
          <div id="cardList" class="card-list">
            <!-- Dynamic card items render here -->
          </div>
        </div>
      </section>

    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
